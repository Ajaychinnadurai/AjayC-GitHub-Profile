<text x="600" y="292" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="3">AJAY C</text>
<text x="600" y="326" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4">AI DEVELOPER • BUILDER • RESEARCHER</text>
<text x="600" y="352" text-anchor="middle" fill="#38BDF8" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">BUILDING INTELLIGENT SYSTEMS THAT SOLVE REAL PROBLEMS</text>
