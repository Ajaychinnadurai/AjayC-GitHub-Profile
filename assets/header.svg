  <path d="M80 70H240V120H310"/>
  <path d="M1120 75H1010V130H940"/>
  <path d="M70 275H180V230H250"/>
  <path d="M1130 285H1030V235H960"/>
</g>
<g fill="#38BDF8" filter="url(#glow)">
  <circle cx="80" cy="70" r="4"/><circle cx="310" cy="120" r="4"/>
  <circle cx="1120" cy="75" r="4"/><circle cx="940" cy="130" r="4"/>
  <circle cx="70" cy="275" r="4"/><circle cx="250" cy="230" r="4"/>
  <circle cx="1130" cy="285" r="4"/><circle cx="960" cy="235" r="4"/>
</g>

<!-- central AI node -->
<g filter="url(#glow)">
  <rect x="505" y="65" width="190" height="190" rx="32" fill="#0D172A" stroke="url(#line)" stroke-width="2"/>
  <rect x="540" y="100" width="120" height="120" rx="20" stroke="#38BDF8" stroke-width="2" opacity=".85"/>
  <path d="M565 135H635M565 160H635M565 185H635" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
