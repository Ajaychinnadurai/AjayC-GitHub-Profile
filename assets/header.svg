<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#0B1224"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
  <linearGradient id="line" x1="180" y1="40" x2="1040" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="380" rx="28" fill="url(#bg)"/>
<path d="M0 310C190 250 250 350 420 285C590 220 680 320 830 260C980 200 1060 260 1200 205" stroke="#17233A" stroke-width="2"/>
<path d="M0 335C170 280 270 370 430 315C590 260 700 345 850 285C1000 225 1090 285 1200 230" stroke="#17233A" stroke-width="2"/>

